name: SonarQube

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GITHUB_OWNER_RAW: ${{ github.repository_owner }}
  GITHUB_REPO_RAW: ${{ github.event.repository.name }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY}}
  SONAR_ORGANIZATION: heilagrfox 
  SONAR_HOST_URL: https://sonarcloud.io       

jobs:
  
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    outputs:
      coverage-enabled: ${{ steps.check-coverage.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Install dependencies
        run: uv sync --group dev 
      
      - name: Run tests with coverage (XML)
        run: |
          uv run pytest src/tests/ \
            --cov=wines_rag \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-config=.coveragerc
      
      - name: Check if coverage report exists
        id: check-coverage
        run: |
          if [ -f "backend/coverage.xml" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: ./backend/coverage.xml 
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage (LCOV format for Sonar)
        run: npm run test:coverage -- --run --coverage.reporter=lcov
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: ./frontend/coverage/lcov.info
          retention-days: 7
  
  sonarqube-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always() && (needs.test-backend.result == 'success' || needs.test-frontend.result == 'success')
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        if: needs.test-frontend.result == 'success'
        with:
          name: frontend-coverage-report
          path: ./frontend/coverage/
      
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        if: needs.test-backend.result == 'success'
        with:
          name: backend-coverage-report
          path: ./backend/
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.sources=backend/src,frontend/src,qdrant_loader
            -Dsonar.tests=backend/src/tests,frontend/src
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.config.*,**/coverage/**,**/venv/**,frontend/src/assets/**,**/Dockerfile*,**/*.dockerfile,**/docker-compose*.yml,**/docker-compose*.yaml,backend/src/wines_rag/api/**,backend/src/wines_rag/app.py,**/.dockerignore,qdrant_loader/**
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/tests/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.scm.disabled=false
            -Dsonar.verbose=true

  send_telegram_notification:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, sonarqube-scan]
    if: always()
    continue-on-error: true  
    defaults:
      run:
        working-directory: ./tg-bot
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo " Проверка окружения..."
          echo "  TG_BOT_TOKEN задан: ${TG_BOT_TOKEN:+YES}"
          echo "  TG_CHAT_ID задан: ${TG_CHAT_ID:+YES}"
          echo "  Текущая директория: $(pwd)"
          echo "  Скрипт существует: $(test -f notify.py && echo YES || echo NO)"
          
          # Определяем общий статус пайплайна
          OVERALL_STATUS="success"
          if [[ "${{ needs.test-backend.result }}" == "failure" || 
                "${{ needs.test-frontend.result }}" == "failure" || 
                "${{ needs.sonarqube-scan.result }}" == "failure" ]]; then
            OVERALL_STATUS="failed"
          elif [[ "${{ needs.test-backend.result }}" == "cancelled" || 
                  "${{ needs.test-frontend.result }}" == "cancelled" || 
                  "${{ needs.sonarqube-scan.result }}" == "cancelled" ]]; then
            OVERALL_STATUS="canceled"
          fi
          
          echo "Запускаем Python-скрипт..."
          python3 notify.py \
            "$OVERALL_STATUS" \
            "CI/CD Pipeline" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.ref_name }}" \
            "${{ github.sha }}"