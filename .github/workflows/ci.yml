name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  GITHUB_OWNER_RAW: ${{ github.repository_owner }}
  GITHUB_REPO_RAW: ${{ github.event.repository.name }}
jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
        - uses: actions/checkout@v4
        - name: Install uv
          uses: astral-sh/setup-uv@v3
          with:
            version: "latest"
        - name: Install dependencies (uv sync)
          run: uv sync --group dev 
        - name: Run tests with coverage
          run: uv run pytest src/tests/ --cov=wines_rag --cov-report=term --cov-config=.coveragerc

  test-frontend:
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --run

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: ./frontend/coverage/
          retention-days: 7
  
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test-backend
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build backend package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: ./backend/dist/
          retention-days: 5


  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'     
          node-version: '24'  
          cache-dependency-path: ./frontend/package-lock.json 

      - name: Install dependencies
        run: npm ci          

      - name: Build frontend
        run: npm run build


  build-qdrant-data-loader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build-backend
    defaults:
      run:
        working-directory: ./qdrant_loader  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build Qdrant Data Loader package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-loader-dist
          path: ./qdrant_loader/dist/
          retention-days: 5

  build-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    needs: [build-frontend, build-push-backend] 
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Normalize names to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "$GITHUB_OWNER_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "$GITHUB_REPO_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/wines-rag-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/wines-rag-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
              
  build-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    needs: build-backend
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize names to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "$GITHUB_OWNER_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "$GITHUB_REPO_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          load: true 
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/wines_rag_backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/wines_rag_backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  build-push-qdrant-data-loader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    needs: build-qdrant-data-loader
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize names to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "$GITHUB_OWNER_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "$GITHUB_REPO_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Qdrant Data Loader
        uses: docker/build-push-action@v5
        with:
          context: ./qdrant_loader
          file: ./qdrant_loader/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/qdrant-loader:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/qdrant-loader:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max          

  send_telegram_notification:
    runs-on: ubuntu-latest
    needs: [build-push-frontend, build-push-backend, build-push-qdrant-data-loader]
    if: always()
    continue-on-error: true  
    defaults:
      run:
        working-directory: ./tg-bot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo " Проверка окружения..."
          echo "  TG_BOT_TOKEN задан: ${TG_BOT_TOKEN:+YES}"
          echo "  TG_CHAT_ID задан: ${TG_CHAT_ID:+YES}"
          
          # Определяем общий статус пайплайна
          OVERALL_STATUS="success"
          if [[ "${{ needs.build-push-frontend.result }}" == "failure" || 
                "${{ needs.build-push-backend.result }}" == "failure" || 
                "${{ needs.build-push-qdrant-data-loader.result }}" == "failure" ]]; then
            OVERALL_STATUS="failed"
          elif [[ "${{ needs.build-push-frontend.result }}" == "cancelled" || 
                  "${{ needs.build-push-backend.result }}" == "cancelled" || 
                  "${{ needs.build-push-qdrant-data-loader.result }}" == "cancelled" ]]; then
            OVERALL_STATUS="canceled"
          fi
          
          echo "Запускаем Python-скрипт..."
          python3 notify.py \
            "$OVERALL_STATUS" \
            "CI/CD pipeline" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.ref_name }}" \
            "${{ github.sha }}"