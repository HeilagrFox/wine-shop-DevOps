name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  GITHUB_OWNER_RAW: ${{ github.repository_owner }}
  GITHUB_REPO_RAW: ${{ github.event.repository.name }}
jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
        - uses: actions/checkout@v4
        - name: Install uv
          uses: astral-sh/setup-uv@v3
          with:
            version: "latest"
        - name: Install dependencies (uv sync)
          run: uv sync --group dev 
        - name: Run tests with coverage
          run: uv run pytest src/tests/ --cov=wines_rag --cov-report=term --cov-config=.coveragerc

  test-frontend:
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --run

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: ./frontend/coverage/
          retention-days: 7
  
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test-backend
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build backend package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: ./backend/dist/
          retention-days: 5


  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'     
          node-version: '24'  
          cache-dependency-path: ./frontend/package-lock.json 

      - name: Install dependencies
        run: npm ci          

      - name: Build frontend
        run: npm run build


  build-qdrant-data-loader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build-backend
    defaults:
      run:
        working-directory: ./qdrant_loader  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build Qdrant Data Loader package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-loader-dist
          path: ./qdrant_loader/dist/
          retention-days: 5

  build-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    needs: [build-frontend, build-push-backend] 
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Normalize names to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "$GITHUB_OWNER_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "$GITHUB_REPO_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/wines-rag-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/wines-rag-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
              
  build-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    needs: build-backend
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize names to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "$GITHUB_OWNER_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "$GITHUB_REPO_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          load: true 
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/wines_rag_backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/wines_rag_backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  build-push-qdrant-data-loader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    needs: build-qdrant-data-loader
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize names to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "$GITHUB_OWNER_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "$GITHUB_REPO_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Qdrant Data Loader
        uses: docker/build-push-action@v5
        with:
          context: ./qdrant_loader
          file: ./qdrant_loader/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/qdrant-loader:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/qdrant-loader:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max   

  argocd-version-image-change:
    runs-on: ubuntu-latest
    needs: [build-push-frontend, build-push-backend, build-push-qdrant-data-loader]
    permissions:
      contents: write  
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true  
    - name: Install yq
      run: |
        wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
        chmod +x /usr/local/bin/yq
    - name: Update Kubernetes manifests
      run: |
        # Backend
        yq -i '(.spec.template.spec.containers[] | select(.name == "backend")).image = "ghcr.io/heilagrfox/wine-shop-devops/wines_rag_backend:${{ github.sha }}"' kuber/backend.yml
        
        # Frontend
        yq -i '(.spec.template.spec.containers[] | select(.name == "frontend")).image = "ghcr.io/heilagrfox/wine-shop-devops/wines-rag-frontend:${{ github.sha }}"' kuber/frontend.yml
    - name: Commit Kubernetes manifests
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: |
          chore: update image tags to ${{ github.sha }}
          
          - backend: ${{ github.sha }}
          - frontend: ${{ github.sha }}
          
          [skip ci]
        file_pattern: 'kuber/*.yml'    
          

  send-telegram-notification:
    runs-on: ubuntu-latest
    needs: [argocd_version_image_change]
    if: always()
    continue-on-error: true  
    permissions:
      contents: read
      actions: read
    steps:
      - name: Generate dynamic job statuses
        id: gen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOBS_RAW=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100)

          JOBS_MD=$(echo "$JOBS_RAW" | jq -r '
            .jobs
            | map(select(.name != "send_telegram_notification"))
            | map({
                name: .name,
                status: (.conclusion // "skipped"),
                emoji: (if .conclusion == "success" then "✅"
                        elif .conclusion == "failure" then "❌"
                        elif .conclusion == "cancelled" then "⚠️"
                        else "⏭️" end)
              })
            | map("\(.emoji) \(.name): \(.status)")
            | join("\n")
          ')

          OVERALL=$(echo "$JOBS_RAW" | jq -r '
            [.jobs[].conclusion] | map(select(. != null)) |
            if length == 0 then "pending"
            elif any(. == "failure") then "failure"
            elif all(. == "success") then "success"
            else "cancelled"
            end
          ')

          case "$OVERALL" in
            success)   O_EMOJI="✅"; O_TEXT="Успешно" ;;
            failure)   O_EMOJI="❌"; O_TEXT="С ошибками" ;;
            cancelled) O_EMOJI="⚠️"; O_TEXT="Отменён" ;;
            *)         O_EMOJI="⏳"; O_TEXT="В процессе" ;;
          esac

          echo "jobs_list<<EOF" >> $GITHUB_OUTPUT
          echo "$JOBS_MD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "overall_emoji=$O_EMOJI" >> $GITHUB_OUTPUT
          echo "overall_text=$O_TEXT" >> $GITHUB_OUTPUT
          echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ steps.gen.outputs.overall_emoji }} *CI/CD Pipeline: ${{ steps.gen.outputs.overall_text }}*

            *Репозиторий:* ${{ github.repository }}
            *Ветка:* ${{ github.ref_name }}
            *Автор:* ${{ github.actor }}
            *Запуск:* [Посмотреть логи](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            *Статусы джоб:*
            ${{ steps.gen.outputs.jobs_list }}

            *Завершён:* ${{ steps.gen.outputs.timestamp }}