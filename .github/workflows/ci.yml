name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
        - uses: actions/checkout@v3
        - name: Install uv
          uses: astral-sh/setup-uv@v3
          with:
            version: "latest"
        - name: Install dependencies (uv sync)
          run: uv sync --group dev 
        - name: Run tests with coverage
          run: uv run pytest src/tests/ --cov=wines_rag --cov-report=term --cov-config=.coveragerc
  
  build_backend:
    runs-on: ubuntu-latest
    needs: test  
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false 
          load: true 
          tags: |
            wines-rag-backend:latest
            wines-rag-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was built
        run: docker images | grep wines-rag-backend