name: Yandex Cloud Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Действие (plan / apply / destroy)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan -var="yc_cloud_id=${{ secrets.YC_CLOUD_ID }}" -var="yc_folder_id=${{ secrets.YC_FOLDER_ID }}" -var="yc_sa_key=${{ secrets.YC_SA_KEY }}" -var="ssh_public_key_content=${{ secrets.SSH_PUBLIC_KEY_CONTENT }}"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -var="yc_cloud_id=${{ secrets.YC_CLOUD_ID }}" -var="yc_folder_id=${{ secrets.YC_FOLDER_ID }}" -var="yc_sa_key=${{ secrets.YC_SA_KEY }}" -var="ssh_public_key_content=${{ secrets.SSH_PUBLIC_KEY_CONTENT }}"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var="yc_cloud_id=${{ secrets.YC_CLOUD_ID }}" -var="yc_folder_id=${{ secrets.YC_FOLDER_ID }}" -var="yc_sa_key=${{ secrets.YC_SA_KEY }}" -var="ssh_public_key_content=${{ secrets.SSH_PUBLIC_KEY_CONTENT }}"
      