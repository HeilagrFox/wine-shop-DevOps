apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wines-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: ghcr.io/heilagrfox/wine-shop-devops/wines_rag_backend:76b27273dfa83e088a27abf56fa7b94c5bf97fd6
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: HF_HOME
              value: "/app/.cache/huggingface"
            - name: FASTEMBED_CACHE_PATH
              value: "/app/.cache/fastembed"
          resources:
            requests:
              cpu: 500m
              memory: 1028Mi
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wines-rag
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
  template:
    spec:
      containers: []
